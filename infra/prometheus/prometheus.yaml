global:
  scrape_interval: 15s #Scrape interval to every 15 seconds.
  evaluation_interval: 15s #Evaluate rules every 15 seconds.

scrape_configs:
  - job_name: "prometheus"
    # metrics_path defaults to '/metrics'
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: webserver
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: pg-auth-exporter
    static_configs:
      - targets : ['pg-auth-exporter:9187']

  - job_name: pg-product-exporter
    static_configs:
      - targets : ['pg-product-exporter:9187']

  - job_name: pg-order-exporter
    static_configs:
      - targets : ['pg-order-exporter:9187']
